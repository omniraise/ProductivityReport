<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Indonesia F2F — Productivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161B;
    --surface:#1B2129;
    --surface-2:#232B35;
    --line:#2C3540;
    --ink:#F3F5F7;
    --ink-dim:#9AA5B1;
    --ink-faint:#5F6A76;
    --net:#4FD8AE;
    --cc:#F2B84B;
    --u30:#7C9EFF;
    --gross:#EF8354;
    --bad:#E8607A;
    --green:#4FD8AE;
    --yellow:#F2C94C;
    --red:#E8607A;
    --blue:#4A90E2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
  body{padding-bottom:40px;}
  .wrap{max-width:520px; margin:0 auto; padding:0 14px;}

  header.top{
    position:sticky; top:0; z-index:20; background:linear-gradient(180deg, var(--bg) 82%, transparent);
    padding:16px 0 8px;
  }
  .eyebrow{
    font-family:'Archivo',sans-serif; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    font-size:11px; color:var(--net); margin:0 0 2px;
  }
  h1{
    font-family:'Archivo',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.01em;
    margin:0 0 2px; line-height:1.1;
  }
  .asof{font-size:12px; color:var(--ink-faint); margin:0 0 14px;}

  .seg4{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:3px; margin-bottom:4px;}
  .seg4 button{
    padding:9px 2px; border-radius:8px; border:none; background:transparent; color:var(--ink-dim);
    font-family:'Archivo',sans-serif; font-weight:700; font-size:11px; letter-spacing:.01em;
  }
  .seg4 button.active{background:var(--net); color:#0B1210;}
  .period-range{font-size:11px; color:var(--ink-faint); margin:0 0 12px; text-align:center;}

  .search{position:relative; margin-bottom:10px;}
  .search input{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:15px; font-family:'Inter',sans-serif; outline:none;
  }
  .search input:focus{border-color:var(--net);}
  .search input::placeholder{color:var(--ink-faint);}
  .suggestions{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface-2);
    border:1px solid var(--line); border-radius:12px; max-height:260px; overflow-y:auto; z-index:30;
    display:none; box-shadow:0 12px 28px rgba(0,0,0,.4);
  }
  .suggestions.show{display:block;}
  .sugg-item{padding:11px 14px; font-size:14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px;}
  .sugg-item:last-child{border-bottom:none;}
  .sugg-item:active{background:var(--surface);}
  .sugg-name{font-weight:600;}
  .sugg-role{color:var(--ink-faint); font-size:11.5px; white-space:nowrap;}

  .clearbar{display:none; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .clearbar.show{display:flex;}
  .clearbar button{
    background:var(--surface); color:var(--ink-dim); border:1px solid var(--line); border-radius:9px;
    padding:7px 11px; font-size:12.5px; font-family:'Inter',sans-serif;
  }

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-faint);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  .empty-state p{font-size:14px; line-height:1.5; max-width:280px; margin:0 auto;}

  .team-card{
    background:linear-gradient(155deg, var(--surface-2), var(--surface)); border:1px solid var(--net);
    border-radius:16px; padding:16px; margin-bottom:14px;
  }
  .team-card .tt-label{font-family:'Archivo',sans-serif; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--net); margin-bottom:2px;}
  .team-card .tt-name{font-weight:700; font-size:17px; margin-bottom:12px;}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;}
  .stat-cell .num{font-family:'Archivo',sans-serif; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums;}
  .stat-cell .lbl{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:1px;}

  .campaign-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;
  }
  .campaign-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .campaign-name{font-family:'Archivo',sans-serif; font-weight:800; font-size:18px;}
  .campaign-head-count{font-size:12px; color:var(--ink-faint);}
  .warn-chip{
    display:inline-block; margin-top:6px; font-size:10.5px; color:var(--yellow); background:rgba(242,201,76,.12);
    border-radius:8px; padding:4px 8px; line-height:1.4;
  }
  .target-row{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); margin-top:3px;}

  /* Pulse (SalesPulse prototype) */
  .rank-badge{vertical-align:middle; margin-right:6px; flex:0 0 auto; object-fit:contain; filter:drop-shadow(0 0 3px rgba(0,0,0,.6));}
  .mythic-stars{color:#FF7BE0; font-size:11px; margin-right:6px; letter-spacing:1px; text-shadow:0 0 6px rgba(255,123,224,.8);}
  .team-summary{display:flex; gap:8px; margin-bottom:14px;}
  .sum-card{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-align:center;}
  .sum-card .num{font-family:'Archivo',sans-serif; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums;}
  .sum-card .lbl{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  .pulse-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 12px; margin-bottom:9px;
  }
  .pulse-head{display:flex; align-items:center; gap:10px; margin-bottom:11px;}
  .vit-ring{
    width:50px; height:50px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--zone) calc(var(--pct)*1%), var(--surface-2) 0);
  }
  .vit-ring span{
    width:40px; height:40px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; color:var(--ink);
  }
  .pulse-id{flex:1; min-width:0;}
  .pulse-id .name{
    font-weight:700; font-size:13.5px; line-height:1.25; display:flex; align-items:center; gap:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pulse-id .name em{font-style:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pulse-id .role{font-size:10.5px; color:var(--ink-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .zone-pill{
    font-size:9px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:20px;
    color:#0B1210; flex:0 0 auto;
  }
  .pillar{margin-bottom:9px;}
  .pillar:last-child{margin-bottom:0;}
  .pillar-top{display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px; margin-bottom:3px; gap:8px;}
  .pillar-top .p-label{color:var(--ink-dim); font-weight:600; flex:0 0 auto;}
  .pillar-top .p-val{font-weight:700; font-variant-numeric:tabular-nums; flex:0 0 auto;}
  .pillar-detail{
    font-size:10px; color:var(--ink-faint); margin-top:4px; line-height:1.45;
    display:flex; flex-wrap:wrap; gap:3px 8px;
  }
  .pillar-detail span{white-space:nowrap;}
  .no-data{color:var(--ink-faint); font-style:italic;}
  .pulse-note{
    background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:11px 13px; margin-bottom:12px;
    font-size:11px; color:var(--ink-dim); line-height:1.5;
  }
  .pulse-note strong{color:var(--ink);}
  .rank-legend{
    display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;
  }
  .rank-legend div{
    display:flex; align-items:center; gap:3px; font-size:9.5px; color:var(--ink-faint);
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:3px 8px 3px 5px;
  }

  .incentive-card{
    background:linear-gradient(165deg, #0B2545, #123A63 55%, #137A7F);
    border:1px solid #1B5C63; border-radius:18px; padding:22px 20px 20px; margin-bottom:12px; text-align:center;
    position:relative; overflow:hidden;
  }
  .incentive-eyebrow{ font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#E8B94D; margin:0 0 8px; }
  .incentive-headline{ font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; color:#fff; margin:0 0 14px; }
  .incentive-ribbon{
    display:inline-block; background:#E8B94D; color:#3A2A05; font-weight:700; font-size:10px;
    letter-spacing:.08em; text-transform:uppercase; padding:4px 12px; border-radius:20px; margin-bottom:10px;
  }
  .incentive-name{ font-family:'Archivo',sans-serif; font-weight:800; font-size:21px; color:#fff; margin:0 0 2px; }
  .incentive-role{ font-size:12px; color:#BFE3DE; margin:0 0 16px; }
  .incentive-stat-row{ display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
  .incentive-stat-badge{
    flex:1; max-width:140px; background:rgba(223,246,242,.1); border:1px solid rgba(223,246,242,.25);
    border-radius:12px; padding:10px 8px;
  }
  .incentive-stat-badge .val{ font-family:'Archivo',sans-serif; font-weight:800; font-size:19px; color:#fff; }
  .incentive-stat-badge .lbl{ font-size:10px; color:#BFE3DE; text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .incentive-stat-badge .gate{ font-size:9.5px; color:#8FD4C8; margin-top:3px; }
  .incentive-prize{ font-size:13.5px; color:#fff; font-weight:600; margin:0 0 4px; }
  .incentive-rule{ font-size:10px; color:#8FB0C4; line-height:1.5; margin:14px 0 0; }

  .lb-row{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{
    flex:0 0 24px; font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; color:var(--ink-faint); text-align:center;
  }
  .lb-info{flex:1; min-width:0;}
  .lb-name{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lb-role{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .lb-stats{display:flex; gap:12px; flex:0 0 auto;}
  .lb-stat{display:flex; flex-direction:column; align-items:flex-end; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums;}
  .lb-stat-lbl{font-size:9px; color:var(--ink-faint); font-weight:500; text-transform:uppercase; letter-spacing:.04em;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
    margin-bottom:10px; position:relative; overflow:hidden;
  }
  .card.me{border-color:var(--net);}
  .tier-tab{position:absolute; left:0; top:0; bottom:0; width:4px;}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:8px;}
  .name{font-weight:700; font-size:15px; line-height:1.25;}
  .name .you{color:var(--net); font-size:11px; font-weight:700; margin-left:6px;}
  .role{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .status-pill{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 8px; border-radius:20px; white-space:nowrap; flex:0 0 auto;
  }
  .status-active{background:rgba(79,216,174,.14); color:var(--net);}
  .status-inactive{background:rgba(232,96,122,.14); color:var(--bad);}

  .metric{margin-bottom:8px;}
  .metric:last-child{margin-bottom:0;}
  .metric-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
  .metric-top .m-label{color:var(--ink-dim); font-weight:500;}
  .metric-top .m-val{font-weight:700; font-variant-numeric:tabular-nums;}
  .bar-track{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}

  .fd-badge{
    display:inline-flex; align-items:center; gap:5px; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .fd-dot{width:8px; height:8px; border-radius:50%;}

  footer.note{
    margin-top:22px; padding-top:14px; border-top:1px solid var(--line); color:var(--ink-faint); font-size:11.5px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Omniraise · Indonesia</p>
    <h1>F2F Productivity</h1>
    <p class="asof" id="asof"></p>

    <div class="seg4" id="periodSeg">
      <button data-p="dashboard" class="active">Dashboard</button>
      <button data-p="month">Month</button>
      <button data-p="p1">P1</button>
      <button data-p="p2">P2</button>
      <button data-p="pulse">Leaderboard</button>
    </div>
    <p class="period-range" id="periodRange"></p>

    <div id="searchWrap">
      <div class="search">
        <input type="text" id="searchInput" placeholder="Search a leader's name…" autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="clearbar" id="clearbar">
        <span style="font-size:13px; color:var(--ink-dim);">Team: <strong id="viewingName" style="color:var(--ink);"></strong></span>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
  </header>

  <div id="content"></div>

  <footer class="note" id="footerNote"></footer>
</div>

const FD_THRESHOLDS = {
  month: { green:30, yellow:16 },
  p1:    { green:15, yellow:8 },
  p2:    { green:15, yellow:8 },
};

function fdZoneColor(fd, per){
  const t = FD_THRESHOLDS[per] || FD_THRESHOLDS.month;
  if(fd >= t.green) return 'var(--green)';
  if(fd >= t.yellow) return 'var(--yellow)';
  return 'var(--red)';
}
function u30Color(pct){
  if(pct >= 0.40) return 'var(--red)';
  if(pct >= 0.30) return 'var(--yellow)';
  return 'var(--green)';
}
function ccColor(pct){ return pct >= 0.10 ? 'var(--green)' : 'var(--red)'; }
const NET_SPEED_TARGET = 0.9;
// FD Processable campaign target: active headcount × 19 fixed working days × 0.8
const FD_CAMPAIGN_PER_STAFF = 19 * 0.8; // = 15.2
function netSpeedColor(ns){
  if(ns >= 0.9) return 'var(--blue)';
  if(ns >= 0.7) return 'var(--green)';
  if(ns >= 0.6) return 'var(--yellow)';
  return 'var(--red)';
}
function netSpeedBarPct(ns){ return Math.min(100, (ns / NET_SPEED_TARGET) * 100); }

// P1/P2 use the sheet's exact half-month figures, including validated Net CC/DD counts for Net Speed.
function sumPersonHalf(p, half){
  const d = p[half];
  return {
    gross: d.gross, fd: d.fd, cancel: d.gross-d.fd,
    ccPct: d.gross? d.cc/d.gross:0,
    u30Pct: d.u30pct,
    fdCC: d.fdCC, fdDD: d.fdDD, workingDays: d.workingDays,
  };
}
// Full month = P1 + P2 combined, exact figures (no estimation involved).
function sumPersonFullMonth(p){
  const gross = p.p1.gross + p.p2.gross;
  const fd = p.p1.fd + p.p2.fd;
  const cc = p.p1.cc + p.p2.cc;
  const u30count = Math.round(p.p1.u30pct*p.p1.gross) + Math.round(p.p2.u30pct*p.p2.gross);
  return {
    gross, fd, cancel: gross-fd,
    ccPct: gross? cc/gross : 0,
    u30Pct: gross? u30count/gross : 0,
    fdCC: p.p1.fdCC + p.p2.fdCC, fdDD: p.p1.fdDD + p.p2.fdDD,
    workingDays: p.p1.workingDays + p.p2.workingDays,
  };
}

function allNames(){
  const set = new Map();
  PEOPLE.forEach(p=>{ if(!set.has(p.name)) set.set(p.name, p.position); });
  return [...set.entries()].map(([name,position])=>({name,position}));
}

function teamFor(name){
  const self = PEOPLE.filter(p=>p.name===name);
  const reports = PEOPLE.filter(p=> p.name!==name && HIER_FIELDS.some(f=>p[f]===name));
  return [...self, ...reports];
}

function fmtPct(v){ return Math.round(v*100) + '%'; }

function renderSuggestions(query){
  const box = document.getElementById('suggestions');
  if(!query){ box.classList.remove('show'); box.innerHTML=''; return; }
  const q = query.toLowerCase();
  const matches = allNames().filter(n=>n.name.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){ box.classList.remove('show'); box.innerHTML=''; return; }
  box.innerHTML = matches.map(m=>`<div class="sugg-item" data-name="${m.name.replace(/"/g,'&quot;')}"><span class="sugg-name">${m.name}</span><span class="sugg-role">${m.position}</span></div>`).join('');
  box.classList.add('show');
  box.querySelectorAll('.sugg-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      scopeName = el.getAttribute('data-name');
      document.getElementById('searchInput').value='';
      box.classList.remove('show');
      render();
    });
  });
}

document.getElementById('searchInput').addEventListener('input', e=>renderSuggestions(e.target.value));
document.getElementById('clearBtn').addEventListener('click', ()=>{ scopeName=null; render(); });
document.getElementById('periodSeg').addEventListener('click', (e)=>{

document.addEventListener('click', (e)=>{

function monthMetricsFor(p){
  // Net Speed = (0.9 * FD Processable Credit Card + 0.8 * FD Processable non-credit-card) / working days, P1+P2 combined
  const fdCC = p.p1.fdCC + p.p2.fdCC;
  const fdDD = p.p1.fdDD + p.p2.fdDD;
  const wd = p.workingDays || 0;
  const netSpeed = wd? (fdCC*0.9 + fdDD*0.8) / wd : 0;

  const gross = p.p1.gross + p.p2.gross;
  const cc = p.p1.cc + p.p2.cc;
  const fd = p.p1.fd + p.p2.fd;
  const u30count = Math.round(p.p1.u30pct*p.p1.gross) + Math.round(p.p2.u30pct*p.p2.gross);

  return {
    netSpeed,
    ccPct: gross? cc/gross : 0,
    u30Pct: gross? u30count/gross : 0,
    gross, fd, cancel: gross-fd, workingDays: wd,
  };
}

  // each person's raw pledge-level charity mix (charityCounts), used only as a WEIGHTING RATIO

  // Net Speed from raw data.

  const unassigned = { people:[], wd:0, netUnits:0, cc:0, gross:0, fd:0, u30:0 };
  let unassignedHas = false;

    const counts = p.charityCounts || {};
    const codes = Object.keys(counts);
    const total = codes.reduce((s,k)=>s+counts[k],0);
    const m = monthMetricsFor(p);
    const netUnitsFull = (p.p1.fdCC+p.p2.fdCC)*0.9 + (p.p1.fdDD+p.p2.fdDD)*0.8;
    const ccFull = p.p1.cc + p.p2.cc;
    const u30Full = Math.round(p.p1.u30pct*p.p1.gross) + Math.round(p.p2.u30pct*p.p2.gross);

    if(total === 0){
      unassignedHas = true;
      unassigned.people.push(p);
      unassigned.wd += m.workingDays;
      unassigned.netUnits += netUnitsFull;
      unassigned.cc += ccFull;
      unassigned.gross += m.gross;
      unassigned.fd += m.fd;
      unassigned.u30 += u30Full;
      return;

function renderLeaderView(){
  document.getElementById('searchWrap').style.display = 'block';
  const clearbar = document.getElementById('clearbar');
  if(scopeName){
    clearbar.classList.add('show');
    document.getElementById('viewingName').textContent = scopeName;
  } else {
    clearbar.classList.remove('show');
  }

  const content = document.getElementById('content');
  if(!scopeName){
    content.innerHTML = `<div class="empty-state"><div class="big">👤</div><p>Search and select a leader's name to see their team's performance for this period, plus every individual below them.</p></div>`;
    document.getElementById('footerNote').textContent = '';
    return;
  }

  const list = teamFor(scopeName);
  const getMetrics = p => period==='month' ? sumPersonFullMonth(p) : sumPersonHalf(p, period);

  // team aggregate
  let tGross=0, tFd=0, tCc=0, tU30=0, tNetCC=0, tNetDD=0, tWd=0;
  list.forEach(p=>{
    const m = getMetrics(p);
    tGross += m.gross; tFd += m.fd;
    tCc += period==='month' ? (p.p1.cc + p.p2.cc) : p[period].cc;
    tU30 += Math.round(m.u30Pct * m.gross);
    tNetCC += m.fdCC; tNetDD += m.fdDD; tWd += m.workingDays;
  });
  const tCancel = tGross - tFd;
  const tCcPct = tGross? tCc/tGross : 0;
  const tU30Pct = tGross? tU30/tGross : 0;
  const tNetSpeed = tWd? (tNetCC*0.9 + tNetDD*0.8)/tWd : 0;
  const activeCount = list.filter(p=>p.status==='active').length;
  const t = FD_THRESHOLDS[period] || FD_THRESHOLDS.month;
  const teamGreenTarget = t.green * activeCount;
  const teamYellowTarget = t.yellow * activeCount;
  const fdColorTeam = tFd >= teamGreenTarget ? 'var(--green)' : (tFd >= teamYellowTarget ? 'var(--yellow)' : 'var(--red)');
  const teamFdBarPct = teamGreenTarget ? Math.min(100, (tFd / teamGreenTarget) * 100) : 0;

  let html = `<div class="team-card">

      <div class="metric-top"><span class="m-label">Net Speed</span><span class="m-val" style="color:${netSpeedColor(tNetSpeed)}">${tNetSpeed.toFixed(2)} / ${NET_SPEED_TARGET} target</span></div>

    </div>
    <div class="metric" style="margin-top:2px;">
      <div class="metric-top"><span class="m-label">FD Processable</span><span class="m-val" style="color:${fdColorTeam}">${tFd} / ${teamGreenTarget} target</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${teamFdBarPct}%; background:${fdColorTeam};"></div></div>
    </div>
    <div class="stat-grid" style="margin-top:10px;">
      <div class="stat-cell"><div class="num" style="color:var(--cc)">${fmtPct(tCcPct)}</div><div class="lbl">Credit Card %</div></div>
      <div class="stat-cell"><div class="num" style="color:${u30Color(tU30Pct)}">${fmtPct(tU30Pct)}</div><div class="lbl">Under 30 %</div></div>
      <div class="stat-cell"><div class="num">${activeCount} / ${list.length}</div><div class="lbl">Active / Total</div></div>
    </div>
    <div class="stat-grid" style="margin-top:10px;">
      <div class="stat-cell"><div class="num">${tCancel}</div><div class="lbl">Cancelled</div></div>
      <div class="stat-cell"><div class="num">${tGross}</div><div class="lbl">Gross</div></div>
      <div class="stat-cell"><div class="num">${tWd}</div><div class="lbl">Working Days</div></div>
    </div>
  </div>`;

  // sort individuals by FD processable desc
  const withMetrics = list.map(p=>({p, m: getMetrics(p)}));
  withMetrics.sort((a,b)=> b.m.fd - a.m.fd);

  html += withMetrics.map(({p,m})=>{
    const isMe = p.name===scopeName;
    const tierColor = TIER_COLOR[p.position] || 'var(--ink-faint)';
    const color = fdZoneColor(m.fd, period);
    const fdBarPct = Math.min(100, (m.fd / t.green) * 100);
    const u30c = u30Color(m.u30Pct);
    const psPerson = (period==='month') ? sumPersonFullMonth(p) : sumPersonHalf(p, period);
    const nsPerson = psPerson.workingDays ? (psPerson.fdCC*0.9 + psPerson.fdDD*0.8)/psPerson.workingDays : 0;
    const rk = rankForNetSpeed(nsPerson);
    return `<div class="card ${isMe?'me':''}">
      <div class="tier-tab" style="background:${tierColor}"></div>
      <div class="card-head">
        <div>
          <div class="name">${badgeIMG(rk,26,mythicStarsNS(nsPerson))}${p.name}${isMe?'<span class="you">LEADER</span>':''}</div>
          <div class="role">${rk.name} · ${p.position} · ${p.region||''}</div>
        </div>
        <div class="status-pill ${p.status==='active'?'status-active':'status-inactive'}">${p.status}</div>
      </div>
      <div class="metric">
        <div class="metric-top"><span class="m-label">FD Processable</span><span class="m-val" style="color:${color}">${m.fd} / ${t.green} target</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${fdBarPct}%; background:${color};"></div></div>
      </div>
      <div class="metric">
        <div class="metric-top"><span class="m-label">Cancelled</span><span class="m-val" style="color:var(--bad)">${m.cancel}</span></div>
      </div>
      <div class="metric">
        <div class="metric-top"><span class="m-label">Working Days</span><span class="m-val">${m.workingDays}</span></div>
      </div>
      <div class="metric">
        <div class="metric-top"><span class="m-label">CC %</span><span class="m-val" style="color:var(--cc)">${fmtPct(m.ccPct)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${m.ccPct*100}%; background:var(--cc);"></div></div>
      </div>
      <div class="metric">
        <div class="metric-top"><span class="m-label">Under 30 %</span><span class="m-val" style="color:${u30c}">${fmtPct(m.u30Pct)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${m.u30Pct*100}%; background:${u30c};"></div></div>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = html;

  document.getElementById('footerNote').textContent =
    `FD Processable target: ${t.green} per active staff member for ${PERIOD_LABEL[period]} (team target scales with active headcount). Green ≥ full team target, yellow ≥ ${t.yellow} per active staff, red below. Under 30 %: green below 30%, yellow 30–40%, red 40%+. Net Speed uses your sheet's FD Processable credit card / non-credit-card split. Sorted by FD Processable, highest first.`;
}

// ---------------- Pulse (SalesPulse prototype) ----------------
// PROPOSED starting weights — all of these are judgment calls for Dave to tune.
const PULSE_W = { perf:0.5, ready:0.3, strain:0.2 };
const ZONES = { peak:75, active:50 };

function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

function pulseFor(p, maxWorkDays){
  const m = monthMetricsFor(p);
  const q = p.pulse || {};
  const hasPledges = m.gross > 0;

  // Performance: donor-age quality 30% · pledge value vs 195k 25% · Net Speed vs 0.9 target 30% · retention 15%
  const ageScore = q.ageScore == null ? 0 : q.ageScore;
  // Value: 100 at >= 195,000 avg monthly (regular gifts only); falls linearly to 0 at 150,000
  const VALUE_FLOOR = 195000, VALUE_ZERO = 150000;
  const valueScore = q.avgValue == null ? 0 : clamp((q.avgValue - VALUE_ZERO) / (VALUE_FLOOR - VALUE_ZERO) * 100, 0, 100);
  const speedScore = clamp(m.netSpeed / NET_SPEED_TARGET * 100, 0, 100);
  const cancelRate = m.gross ? m.cancel / m.gross : 0;
  const retention = hasPledges ? (1 - cancelRate) * 100 : 0;
  const perf = 0.3*ageScore + 0.25*valueScore + 0.3*speedScore + 0.15*retention;

  // Discipline: starts at 100, loses points for Mystery Shopping violations, Quality (QA) violations
  // and late check-ins this month. Higher violation points = lower Discipline.
  const dq = q.discipline || {};
  const msPts = dq.msPts || 0, qaPts = dq.qaPts || 0;
  const lateCount = dq.lateCount || 0, lateMins = dq.lateMins || 0;
  const hasCheckins = !!dq.checkins;
  const penaltyMS = msPts * 7;               // a Major (3 pts) costs 21
  const penaltyQA = qaPts * 7;
  const penaltyLate = lateCount * 4 + Math.min(20, lateMins / 30);  // 4 per late check-in + 1 per 30 min, capped
  const ready = clamp(100 - penaltyMS - penaltyQA - penaltyLate, 0, 100);

  // Strain: 80% daily KPI effort (approach/stopping/presentation) + 20% shift pattern.
  // ASPC benchmarks reflect the targets already used in the ASPC sheet.
  // Strain: 80% daily KPI effort (approach/stopping/presentation) + 20% shift pattern.
  // These are MINIMUM bars, not stretch targets — hitting the minimum scores 75, not 100.
  // Falling short drops you steeply below 75 rather than clipping near the top like a simple ratio would.
  const ASPC_MIN = { A:160, S:30, P:20 };
  function kpiScore(actual, min){
    if(actual >= min) return clamp(75 + (actual-min)/min*100, 75, 100);
    return clamp(actual/min*75, 0, 75);
  }
  const a = q.aspc;
  const hasAspc = !!(a && a.days);
  const effortA = hasAspc ? kpiScore(a.perDayA, ASPC_MIN.A) : 0;
  const effortS = hasAspc ? kpiScore(a.perDayS, ASPC_MIN.S) : 0;
  const effortP = hasAspc ? kpiScore(a.perDayP, ASPC_MIN.P) : 0;
  const effort = 0.4*effortA + 0.3*effortS + 0.3*effortP;

  const workload = maxWorkDays ? (q.workDays||0) / maxWorkDays * 100 : 0;
  const travelShare = q.workDays ? (q.travelDays||0) / q.workDays * 100 : 0;
  const variety = clamp((q.uniqueSites||0) / 4 * 100, 0, 100);
  const pattern = 0.4*workload + 0.3*travelShare + 0.3*variety;

  // No KPI data → score on shift pattern alone rather than penalising them to near-zero.
  const strain = hasAspc ? (0.8*effort + 0.2*pattern) : pattern;

  const vitality = PULSE_W.perf*perf + PULSE_W.ready*ready + PULSE_W.strain*strain;
  const zone = vitality >= ZONES.peak ? 'Peak' : (vitality >= ZONES.active ? 'Active' : 'Low');
  return { vitality, zone, perf, ready, strain, m, q, hasAspc,
           ageScore, valueScore, speedScore, retention, workload, travelShare, variety };
}

const RANKS = [
  { name:'Mythic',   min:90 },
  { name:'Legend',   min:80 },
  { name:'Diamond',  min:70 },
  { name:'Platinum', min:60 },
  { name:'Gold',     min:50 },
  { name:'Silver',   min:40 },
  { name:'Bronze',   min:0  },
];
function rankFor(score){ return RANKS.find(r => score >= r.min) || RANKS[RANKS.length-1]; }
// Extra stars once inside Mythic: Vitality 95+ = 1 star, 98+ = 2, 100 = 3
function mythicStarsVit(score){ return score >= 100 ? 3 : score >= 98 ? 2 : score >= 95 ? 1 : 0; }
// Net Speed ladder: 0.7 = PIP line (Platinum), 0.9 = target (Legend), 1.1 = Mythic
function rankForNetSpeed(ns){
  if(ns >= 1.1) return RANKS[0];
  if(ns >= 0.9) return RANKS[1];
  if(ns >= 0.8) return RANKS[2];
  if(ns >= 0.7) return RANKS[3];
  if(ns >= 0.6) return RANKS[4];
  if(ns >= 0.4) return RANKS[5];
  return RANKS[6];
}
function mythicStarsNS(ns){ return ns >= 1.7 ? 3 : ns >= 1.5 ? 2 : ns >= 1.3 ? 1 : 0; }
function badgeIMG(rank, size, stars){
  const s = size || 24;
  const st = (rank.name==='Mythic' && stars>0) ? `<span class="mythic-stars">${'★'.repeat(stars)}</span>` : '';
  return `<img class="rank-badge" src="${BADGE_IMG[rank.name]}" width="${s}" height="${Math.round(s*0.85)}" alt="${rank.name}" title="${rank.name}">${st}`;
}

function msPtsOf(q){ return (q.discipline&&q.discipline.msPts)||0; }
function qaPtsOf(q){ return (q.discipline&&q.discipline.qaPts)||0; }
function zoneColor(z){ return z==='Peak' ? 'var(--blue)' : (z==='Active' ? 'var(--green)' : 'var(--red)'); }

function renderPulseView(){
  document.getElementById('searchWrap').style.display = 'block';
  const clearbar = document.getElementById('clearbar');
  if(scopeName){ clearbar.classList.add('show'); document.getElementById('viewingName').textContent = scopeName; }
  else { clearbar.classList.remove('show'); }

  const content = document.getElementById('content');
  const base = scopeName ? teamFor(scopeName) : PEOPLE;
  const list = base.filter(p => p.status === 'active');
  const maxWorkDays = Math.max(1, ...PEOPLE.map(p => (p.pulse||{}).workDays || 0));

  const scored = list.map(p => ({ p, s: pulseFor(p, maxWorkDays) })).sort((a,b)=> b.s.vitality - a.s.vitality);
  const counts = { Peak:0, Active:0, Low:0 };
  scored.forEach(({s}) => counts[s.zone]++);

  let html = `<div class="pulse-note">
    <strong>Prototype.</strong> Vitality = 50% Performance + 30% Discipline + 20% Strain. Discipline starts at 100 and loses points for Mystery Shopping violations, QA violations and late check-ins. Strain is 80% daily KPI effort (approach / stopping / presentation) + 20% shift pattern.
  </div>
  <div class="rank-legend">${RANKS.slice().reverse().map(r=>`<div>${badgeIMG(r,16,0)}${r.name}</div>`).join('')}</div>
  <div class="team-summary">
    <div class="sum-card"><div class="num" style="color:var(--blue)">${counts.Peak}</div><div class="lbl">Peak</div></div>
    <div class="sum-card"><div class="num" style="color:var(--green)">${counts.Active}</div><div class="lbl">Active</div></div>
    <div class="sum-card"><div class="num" style="color:var(--red)">${counts.Low}</div><div class="lbl">Low</div></div>
  </div>`;

  html += scored.map(({p,s})=>{
    const zc = zoneColor(s.zone);
    const q = s.q;
    const rk = rankFor(s.vitality);
    const a = q.aspc;
    const perfBits = [
      q.ageScore == null ? 'no aged pledges' : `age ${Math.round(s.ageScore)}`,
      q.avgValue == null ? 'no regular gifts' : `value ${Math.round(q.avgValue/1000)}k`,
      `speed ${s.m.netSpeed.toFixed(2)}`,
      `cancel ${Math.round((s.m.gross? s.m.cancel/s.m.gross:0)*100)}%`,
    ];
    const readyBits = [`MS ${msPtsOf(q)} pts`, `QA ${qaPtsOf(q)} pts`, (q.discipline&&q.discipline.checkins) ? `late ${q.discipline.lateCount||0}\u00d7 (${Math.round(q.discipline.lateMins||0)}m)` : 'no check-in data'];
    const strainBits = a
      ? [`${a.perDayA}/day appr`, `${a.perDayS}/day stop`, `${a.perDayP}/day pres`, `${a.days} KPI days`]
      : [`no KPI data`, `${q.workDays||0} shifts`, `${q.travelDays||0} travel`, `${q.uniqueSites||0} sites`];
    return `<div class="pulse-card">
      <div class="pulse-head">
        <div class="vit-ring" style="--zone:${zc}; --pct:${Math.round(s.vitality)};"><span>${Math.round(s.vitality)}</span></div>
        <div class="pulse-id">
          <div class="name">${badgeIMG(rk,24,mythicStarsVit(s.vitality))}<em>${p.name}</em></div>
          <div class="role">${rk.name} &middot; ${p.position}</div>
        </div>
        <div class="zone-pill" style="background:${zc}">${s.zone}</div>
      </div>
      <div class="pillar">
        <div class="pillar-top"><span class="p-label">Performance</span><span class="p-val" style="color:var(--net)">${Math.round(s.perf)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.perf}%; background:var(--net);"></div></div>
        <div class="pillar-detail">${perfBits.map(b=>`<span>${b}</span>`).join('')}</div>
      </div>
      <div class="pillar">
        <div class="pillar-top"><span class="p-label">Discipline</span><span class="p-val" style="color:var(--cc)">${Math.round(s.ready)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.ready}%; background:var(--cc);"></div></div>
        <div class="pillar-detail">${readyBits.map(b=>`<span>${b}</span>`).join('')}</div>
      </div>
      <div class="pillar">
        <div class="pillar-top"><span class="p-label">Strain</span><span class="p-val" style="color:var(--gross)">${Math.round(s.strain)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.strain}%; background:var(--gross);"></div></div>
        <div class="pillar-detail">${strainBits.map(b=>`<span>${b}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = html;
  document.getElementById('footerNote').textContent = 'Performance = 30% donor-age tier + 25% pledge value (100 at avg \u2265 195k regular gifts, 0 at 150k) + 30% Net Speed vs 0.9 + 15% retention. Discipline = 100 minus 7 per Mystery Shopping violation point, 7 per QA violation point, 4 per late check-in plus 1 per 30 late minutes (capped) \u2014 so a single Major (3 pts) costs 21; staff without a matching check-in record are not penalised for lateness. Strain = 80% daily KPI (40% approaches min 160/day, 30% stopping min 30/day, 30% presentations min 20/day \u2014 hitting the minimum scores 75, not 100; falling short drops steeply) + 20% shift pattern; staff with no matching KPI record are scored on shift pattern alone. Badges follow Vitality here, and Net Speed on Month/P1/P2.';
}

function render(){
  document.querySelectorAll('#periodSeg button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-p')===period);
  });

  if(period === 'dashboard'){
    document.getElementById('periodRange').textContent = 'Month-to-date, by charity code';
    renderMonthView();
  } else if(period === 'pulse'){
    document.getElementById('periodRange').textContent = 'Leaderboard — Vitality ranking, this month';
    renderPulseView();
  } else {
    document.getElementById('periodRange').textContent = PERIOD_LABEL[period];
    renderLeaderView();
  }
}

render();
</script>
</body>
</html>
